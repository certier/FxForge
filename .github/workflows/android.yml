name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Checkout pinned Android PRoot source
        uses: actions/checkout@v4
        with:
          repository: berilevi/proot-static
          ref: 6f8ebfd8e24887dfba64c3f2d7d5fe9dc059b60e
          path: vendor/proot-static
      - name: Install Android NDK for PRoot
        run: sdkmanager "ndk;28.2.13676358"
      - name: Build Android ARM64 PRoot
        run: |
          set -euo pipefail
          mkdir -p proot-artifacts
          NDK="$ANDROID_HOME/ndk/28.2.13676358" \
          OUT="$RUNNER_TEMP/proot-build" \
          REPO_ARTIFACT_DIR="$GITHUB_WORKSPACE/proot-artifacts" \
          bash vendor/proot-static/tools/build-static-aarch64.sh
          file proot-artifacts/proot
          file proot-artifacts/loader
          readelf -h proot-artifacts/proot
          sha256sum proot-artifacts/*
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 0755 proot-artifacts/proot app/src/main/jniLibs/arm64-v8a/libfxforge_proot.so
          install -m 0755 proot-artifacts/loader app/src/main/jniLibs/arm64-v8a/libfxforge_proot_loader.so
          install -m 0755 proot-artifacts/loader32 app/src/main/jniLibs/arm64-v8a/libfxforge_proot_loader32.so
      - name: Upload Android PRoot binaries
        uses: actions/upload-artifact@v4
        with:
          name: fxforge-proot-android-arm64
          path: proot-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fxforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
